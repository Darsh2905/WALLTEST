<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WALLTEST · Information-barrier audit</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314171a'/%3E%3Cpath d='M16 6v20M7 11h18M7 21h18' stroke='%23f4f3ef' stroke-width='2.2' fill='none'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23d3321d'/%3E%3C/svg%3E" />
    <script>
      // set the theme before first paint (no flash). Storage can throw (private mode): fall back to the OS setting.
      (function () {
        var t = null
        try { t = localStorage.getItem('walltest-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
